<svg xmlns="http://www.w3.org/2000/svg" width="1712" height="1260" viewBox="0 0 1712 1260" role="img" aria-labelledby="t d"><title id="t">Основной сценарий СытоМастера</title><desc id="d">Путь от ввода продуктов через поиск и пять состояний выдачи к рецепту, списку покупок и таймеру. Сбой модели ведёт к выдаче из базы, а ошибка каталога или отсутствие совпадений позволяет повторить поиск.</desc><rect width="1712" height="1260" fill="#FFF9F5"/><text x="48" y="54" fill="#AB411A" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">СытоМастер</text><text x="48" y="117" fill="#492E28" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700">От продуктов до готового ужина</text><text x="49" y="155" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400">Основной пользовательский сценарий по разделу 6 брифа команды</text><polyline points="48,181 1664,181" fill="none" stroke="#E0CFC5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="48" y="212" width="355" height="138" rx="18" fill="#FFFFFF" stroke="#DDC9BC" stroke-width="2"/><text x="70" y="249" fill="#492E28" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Открыть главную</text><text x="70" y="282" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Посмотреть тематические блюда или</text><text x="70" y="307" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">перейти к подбору.</text><rect x="478" y="212" width="442" height="138" rx="18" fill="#FFFFFF" stroke="#DDC9BC" stroke-width="2"/><text x="500" y="249" fill="#492E28" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Задать условия</text><text x="500" y="282" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Выбрать продукты, время, бюджет на порцию,</text><text x="500" y="307" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">приоритет и пищевые ограничения.</text><rect x="992" y="212" width="672" height="138" rx="18" fill="#684337" stroke="#684337" stroke-width="2"/><text x="1014" y="249" fill="#FFF9F5" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Дождаться подбора</text><text x="1014" y="282" fill="#FFF0E8" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Сервис ищет по базе. Если подключённая модель отвечает с задержкой,</text><text x="1014" y="307" fill="#FFF0E8" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">видны ожидание и действие «Показать подбор из базы».</text><polyline points="404,281 471,281" fill="none" stroke="#987669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="471.00,281.00 462.22,285.79 462.22,276.21" fill="#987669"/><polyline points="921,281 985,281" fill="none" stroke="#987669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="985.00,281.00 976.22,285.79 976.22,276.21" fill="#987669"/><polyline points="1328,351 1328,392" fill="none" stroke="#987669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="200,392 1512,392" fill="none" stroke="#987669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="200,392 200,423" fill="none" stroke="#987669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="200.00,423.00 195.21,414.22 204.79,414.22" fill="#987669"/><polyline points="528,392 528,423" fill="none" stroke="#987669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.00,423.00 523.21,414.22 532.79,414.22" fill="#987669"/><polyline points="856,392 856,423" fill="none" stroke="#987669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="856.00,423.00 851.21,414.22 860.79,414.22" fill="#987669"/><polyline points="1184,392 1184,423" fill="none" stroke="#987669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1184.00,423.00 1179.21,414.22 1188.79,414.22" fill="#987669"/><polyline points="1512,392 1512,423" fill="none" stroke="#987669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1512.00,423.00 1507.21,414.22 1516.79,414.22" fill="#987669"/><rect x="48" y="430" width="304" height="256" rx="18" fill="#FFFFFF" stroke="#DDC9BC" stroke-width="2"/><text x="70" y="467" fill="#492E28" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Можно готовить</text><text x="70" y="500" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Блюда из доступных продуктов</text><text x="70" y="525" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">и домашнего запаса. Время,</text><text x="70" y="550" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">расчётный бюджет и состав</text><text x="70" y="575" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">отвечают запросу.</text><text x="70" y="663" fill="#AB411A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Выбрать рецепт</text><rect x="376" y="430" width="304" height="256" rx="18" fill="#FFFFFF" stroke="#DDC9BC" stroke-width="2"/><text x="398" y="467" fill="#492E28" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Нужна докупка</text><text x="398" y="500" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Альтернативы в пределах</text><text x="398" y="525" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">времени и бюджета. В каждой</text><text x="398" y="550" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">карточке указано, каких</text><text x="398" y="575" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">продуктов не хватает.</text><text x="398" y="663" fill="#AB411A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Выбрать вариант с докупкой</text><rect x="704" y="430" width="304" height="256" rx="18" fill="#F3E5DB" stroke="#F3E5DB" stroke-width="2"/><text x="726" y="467" fill="#492E28" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Сбой модели</text><text x="726" y="500" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Сообщить, что модель</text><text x="726" y="525" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">недоступна. Показать</text><text x="726" y="550" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">ближайшие варианты из базы с</text><text x="726" y="575" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">теми же ограничениями.</text><text x="726" y="663" fill="#AB411A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Выбрать вариант из базы</text><rect x="1032" y="430" width="304" height="256" rx="18" fill="#FFFFFF" stroke="#DDC9BC" stroke-width="2"/><text x="1054" y="467" fill="#492E28" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Нет совпадений</text><text x="1054" y="500" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Уточнить условия. Если есть</text><text x="1054" y="525" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">варианты за пределами</text><text x="1054" y="550" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">времени или бюджета,</text><text x="1054" y="575" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">показать их после согласия и</text><text x="1054" y="600" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">объяснить отличие.</text><text x="1054" y="663" fill="#AB411A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Вернуться к условиям</text><rect x="1360" y="430" width="304" height="256" rx="18" fill="#F3E5DB" stroke="#F3E5DB" stroke-width="2"/><text x="1382" y="467" fill="#492E28" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Ошибка каталога</text><text x="1382" y="500" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Если данные каталога не</text><text x="1382" y="525" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">загрузились, сообщить об</text><text x="1382" y="550" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">ошибке. Сохранить условия и</text><text x="1382" y="575" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">показать кнопку «Повторить».</text><text x="1382" y="663" fill="#AB411A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Повторить запрос</text><polyline points="1184,687 1184,732 1684,732 1684,196 768,196 768,208" fill="none" stroke="#987669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="768.00,208.00 763.21,199.22 772.79,199.22" fill="#987669"/><polyline points="1664,638 1674,638 1674,370 1444,370 1444,355" fill="none" stroke="#987669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1444.00,355.00 1448.79,363.78 1439.21,363.78" fill="#987669"/><polyline points="200,686 200,722" fill="none" stroke="#987669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="528,686 528,722" fill="none" stroke="#987669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="856,686 856,722" fill="none" stroke="#987669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="200,722 856,722" fill="none" stroke="#987669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="528,722 528,762" fill="none" stroke="#987669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="528.00,762.00 523.21,753.22 532.79,753.22" fill="#987669"/><rect x="343" y="770" width="373" height="141" rx="18" fill="#684337" stroke="#684337" stroke-width="2"/><text x="365" y="807" fill="#FFF9F5" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Открыть рецепт</text><text x="365" y="840" fill="#FFF0E8" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Проверить состав, порции, расчётную</text><text x="365" y="865" fill="#FFF0E8" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">цену и последовательность шагов.</text><polyline points="717,841 786,841" fill="none" stroke="#987669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="786.00,841.00 777.22,845.79 777.22,836.21" fill="#987669"/><rect x="792" y="770" width="394" height="141" rx="18" fill="#FFFFFF" stroke="#DDC9BC" stroke-width="2"/><text x="814" y="807" fill="#492E28" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Нужны покупки?</text><text x="814" y="840" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Перейти к готовке или посмотреть, чего</text><text x="814" y="865" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">ещё не хватает.</text><polyline points="990,911 990,936 543,936 543,966" fill="none" stroke="#987669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="543.00,966.00 538.21,957.22 547.79,957.22" fill="#987669"/><text x="710" y="930" fill="#AB411A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Нужно докупить</text><polyline points="990,936 1326,936 1326,966" fill="none" stroke="#987669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1326.00,966.00 1321.21,957.22 1330.79,957.22" fill="#987669"/><text x="1109" y="930" fill="#AB411A" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Всё уже есть</text><rect x="343" y="973" width="400" height="145" rx="18" fill="#FFFFFF" stroke="#DDC9BC" stroke-width="2"/><text x="365" y="1010" fill="#492E28" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Список покупок</text><text x="365" y="1043" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Проверить количество и расчётную</text><text x="365" y="1068" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">сумму, отметить покупки. Если дорого,</text><text x="365" y="1093" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">вернуться к условиям.</text><rect x="1100" y="973" width="453" height="145" rx="18" fill="#FFFFFF" stroke="#DDC9BC" stroke-width="2"/><text x="1122" y="1010" fill="#492E28" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Готовить по шагам</text><text x="1122" y="1043" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">Запустить таймер нужного шага, получить</text><text x="1122" y="1068" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400">уведомление и перейти к следующему действию.</text><polyline points="744,1048 1092,1048" fill="none" stroke="#987669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1092.00,1048.00 1083.22,1052.79 1083.22,1043.21" fill="#987669"/><polyline points="1326,1119 1326,1158 1121,1158" fill="none" stroke="#987669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1121.00,1158.00 1129.78,1153.21 1129.78,1162.79" fill="#987669"/><rect x="684" y="1133" width="430" height="69" rx="18" fill="#684337" stroke="#684337" stroke-width="2"/><text x="706" y="1170" fill="#FFF9F5" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Ужин готов</text><text x="48" y="1233" fill="#674C43" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400">Учебный сценарий. Строгие пищевые ограничения сохраняются при подборе альтернатив.</text></svg>